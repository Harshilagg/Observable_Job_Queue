# Plaintext credentials checked into a repo are only acceptable here
# because they're the same throwaway local-demo values already
# committed in docker-compose.yml (jobqueue/jobqueue) — this cluster
# never leaves this laptop. A real deployment would generate these at
# apply time (or via sealed-secrets / an external secret manager), not
# commit them; the point being demonstrated here is that the app reads
# its credentials from a Secret at all, not this file's own contents.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: jobqueue
type: Opaque
stringData:
  POSTGRES_USER: jobqueue
  POSTGRES_PASSWORD: jobqueue
  POSTGRES_DB: jobqueue
  # Full DSN, matching internal/config.Config.DatabaseURL — bundled
  # here rather than split into host/port/user/pass fields because the
  # app consumes it as one connection string (pgxpool.ParseConfig), and
  # this whole value is sensitive anyway once the password's embedded.
  DATABASE_URL: postgres://jobqueue:jobqueue@postgres:5432/jobqueue
---
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: jobqueue
type: Opaque
stringData:
  CLICKHOUSE_DB: jobqueue
  CLICKHOUSE_USER: jobqueue
  CLICKHOUSE_PASSWORD: jobqueue
