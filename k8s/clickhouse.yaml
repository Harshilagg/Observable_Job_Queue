apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: jobqueue
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:26.8.2
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          envFrom:
            - secretRef:
                name: clickhouse-credentials
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          # See postgres.yaml's probes for why timeoutSeconds/
          # failureThreshold are raised well above defaults here —
          # same contended-host reasoning, not a ClickHouse-specific
          # concern.
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: jobqueue
spec:
  selector:
    app: clickhouse
  ports:
    - name: native
      port: 9000
      targetPort: 9000
    - name: http
      port: 8123
      targetPort: 8123
